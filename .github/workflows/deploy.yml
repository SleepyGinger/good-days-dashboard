name: Deploy to GitHub Pages

env:
  NEXT_PUBLIC_SENTIMENT_API_URL: ${{ vars.NEXT_PUBLIC_SENTIMENT_API_URL }}
  NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCOGsJMsgjvHmXJ7j17hzrsHDCjKmwaGQA
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: good-days-5515e.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://good-days-5515e-default-rtdb.firebaseio.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: good-days-5515e
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: good-days-5515e.firebasestorage.app
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 50443495976
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:50443495976:web:16e4d1fac4a23cda83631d
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-WXFZ6CSKPJ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install API check dependencies
        run: npm ci --prefix vercel-api

      - name: Verify types, lint and regression tests
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Install browser for smoke checks
        run: npx playwright install --with-deps chromium

      - name: Check browser workflows with isolated fixtures
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/good-days-http.log 2>&1 &
          test_server=$!
          trap 'kill "$test_server"' EXIT
          npm run test:browser

      - name: Add CNAME file
        run: echo "gooddays.dansalazar.org" > out/CNAME

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3   # ← new major
        with:
          path: ./out                            # same as before

  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ios
      - run: npm run cap:sync
      - name: Compile iPhone simulator target without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme 'Good Days' -destination 'generic/platform=iOS Simulator' -packageAuthorizationProvider netrc -derivedDataPath "$RUNNER_TEMP/GoodDaysDerived" CODE_SIGNING_ALLOWED=NO build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, native]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4            # unchanged
